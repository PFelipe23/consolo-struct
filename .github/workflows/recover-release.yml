name: Recover stalled ConsoloStruct release
on:
  push:
    branches: ["master"]
    paths: [".github/workflows/recover-release.yml"]
permissions:
  actions: write
jobs:
  cancel-stalled-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel the initial release stalled during Linux dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/ricardocorsini/consolo-struct/actions/runs/42294957233/cancel
